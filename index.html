<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite fingerprints /assets, but files in public/ keep their exact name.
         Browsers cache favicons in a store that largely ignores cache-control,
         so a redesigned icon can stay stale for days. Bump ?v= whenever
         favicon.svg changes; that's the only reliable way to force a refetch. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- maximum-scale + viewport-fit: iOS Safari otherwise zooms on input focus
         and ignores the notch inset, both of which wreck the dial layout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf6ef" />
    <meta name="description" content="Wavelength, but every clue has to be an AI startup." />
    <title>WaveLang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
